services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rzrt
      POSTGRES_PASSWORD: rzrt
      POSTGRES_DB: rzrt_dev
    ports:
      - "5432:5432"
    volumes:
      - rzrt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rzrt -d rzrt_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rzrt_postgres_data:
